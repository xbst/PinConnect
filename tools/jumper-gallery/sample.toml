# Jumper settings sample: one pin header for each common shape.
#
# Used by tools/jumper-gallery/generate.py for the docs images, and handy as a
# starting point: open it in the designer to see each header's settings. The
# board image is not included; the generator makes a plain one.
#
# Jumpers name pins by their number in the pin list, counted from 1 in the
# order the pins are written. The two-row headers below list their pins column
# by column (row 1, row 2, row 1, ...), so the numbers match the usual odd/even
# numbering of a 2xN header: 1-2 is the first column, 3-4 the second.

[board]
title = "Jumper settings"
image = "board.png"
width = 1400
height = 900

# An on/off jumper: one setting fits it, the other leaves it open.
[[connector]]
id = "TERM"
name = "CAN termination"
type = "HDR-254"
x1 = 80
y1 = 80
x2 = 200
y2 = 140

  [[connector.pin]]
  name = "CAN_H"
  color = "#FFBF00"

  [[connector.pin]]
  name = "120R > L"
  color = "#2ECC71"

  [[connector.setting]]
  label = "120 Ω on"
  jumpers = ["1-2"]
  description = "Fit only on the boards at the two ends of the CAN bus."

  [[connector.setting]]
  label = "Off"
  default = true

# A selector with a shared middle pin: the two positions overlap on pin 2.
[[connector]]
id = "BOOT"
name = "Boot mode"
type = "HDR-254"
x1 = 310
y1 = 80
x2 = 450
y2 = 140

  [[connector.pin]]
  name = "GND"
  color = "#2C3E50"

  [[connector.pin]]
  name = "BOOT0"
  color = "#9B59B6"

  [[connector.pin]]
  name = "3V3"
  color = "#E74C3C"

  [[connector.setting]]
  label = "Run firmware"
  jumpers = ["1-2"]
  default = true

  [[connector.setting]]
  label = "DFU bootloader"
  jumpers = ["2-3"]
  description = "Fit before plugging in USB to flash new firmware."

# An N-way selector: one row is shared, one jumper picks a pin in the other.
[[connector]]
id = "FANV"
name = "Fan voltage"
type = "HDR-254-2R"
x1 = 560
y1 = 60
x2 = 700
y2 = 160

  [[connector.pin]]
  name = "VFAN"
  color = "#F39C12"

  [[connector.pin]]
  name = "5V"
  color = "#E74C3C"
  row = 2

  [[connector.pin]]
  name = "VFAN"
  color = "#F39C12"

  [[connector.pin]]
  name = "12V"
  color = "#E74C3C"
  row = 2

  [[connector.pin]]
  name = "VFAN"
  color = "#F39C12"

  [[connector.pin]]
  name = "VIN"
  color = "#E74C3C"
  row = 2

  [[connector.setting]]
  label = "5V"
  jumpers = ["1-2"]

  [[connector.setting]]
  label = "12V"
  jumpers = ["3-4"]

  [[connector.setting]]
  label = "VIN"
  jumpers = ["5-6"]
  default = true
  description = "Fans run at the input voltage."

# Combinations: each setting lists every jumper it fits, or none at all.
[[connector]]
id = "MSTEP"
name = "Microstepping (A4988)"
type = "HDR-254-2R"
x1 = 810
y1 = 60
x2 = 950
y2 = 160

  [[connector.pin]]
  name = "VDD"
  color = "#E74C3C"

  [[connector.pin]]
  name = "MS1"
  color = "#3498DB"
  row = 2

  [[connector.pin]]
  name = "VDD"
  color = "#E74C3C"

  [[connector.pin]]
  name = "MS2"
  color = "#3498DB"
  row = 2

  [[connector.pin]]
  name = "VDD"
  color = "#E74C3C"

  [[connector.pin]]
  name = "MS3"
  color = "#3498DB"
  row = 2

  [[connector.setting]]
  label = "Full"

  [[connector.setting]]
  label = "1/2"
  jumpers = ["1-2"]

  [[connector.setting]]
  label = "1/4"
  jumpers = ["3-4"]

  [[connector.setting]]
  label = "1/8"
  jumpers = ["1-2", "3-4"]

  [[connector.setting]]
  label = "1/16"
  jumpers = ["1-2", "3-4", "5-6"]
  default = true

# A multi-pole switch: two jumpers that always move together.
[[connector]]
id = "ROUTE"
name = "Data routing"
type = "HDR-254-2R"
x1 = 1060
y1 = 60
x2 = 1200
y2 = 160
description = "Routes the H and L pins of the power connector."

  [[connector.pin]]
  name = "CAN_L"
  color = "#2ECC71"

  [[connector.pin]]
  name = "CAN_H"
  color = "#FFBF00"
  row = 2

  [[connector.pin]]
  name = "L"
  color = "#888888"

  [[connector.pin]]
  name = "H"
  color = "#888888"
  row = 2

  [[connector.pin]]
  name = "D-"
  color = "#3498DB"

  [[connector.pin]]
  name = "D+"
  color = "#3498DB"
  row = 2

  [[connector.setting]]
  label = "CAN"
  jumpers = ["1-3", "2-4"]
  default = true

  [[connector.setting]]
  label = "USB"
  jumpers = ["3-5", "4-6"]

# Groups: unrelated jumpers on one header, each chosen on its own.
[[connector]]
id = "CFG"
name = "Config header"
type = "HDR-254-2R"
x1 = 1060
y1 = 480
x2 = 1200
y2 = 580

  [[connector.pin]]
  name = "CANH"
  color = "#FFBF00"

  [[connector.pin]]
  name = "120R"
  color = "#888888"
  row = 2

  [[connector.pin]]
  name = "BOOT0"
  color = "#9B59B6"

  [[connector.pin]]
  name = "3V3"
  color = "#E74C3C"
  row = 2

  [[connector.pin]]
  name = "VUSB"
  color = "#E74C3C"

  [[connector.pin]]
  name = "5V"
  color = "#E74C3C"
  row = 2

  [[connector.setting]]
  group = "Termination"
  label = "On"
  jumpers = ["1-2"]

  [[connector.setting]]
  group = "Termination"
  label = "Off"
  default = true

  [[connector.setting]]
  group = "Boot"
  label = "Run"
  default = true

  [[connector.setting]]
  group = "Boot"
  label = "DFU"
  jumpers = ["3-4"]

  [[connector.setting]]
  group = "USB power"
  label = "Off"
  default = true

  [[connector.setting]]
  group = "USB power"
  label = "On"
  jumpers = ["5-6"]
  description = "Powers the board from USB. Never fit it with VIN connected."
