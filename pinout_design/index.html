<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PinConnect Designer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app">

  <!-- Top toolbar -->
  <div class="toolbar">
    <span class="toolbar-title">PinConnect Designer</span>
    <button id="undo-btn" title="Undo (Ctrl+Z)" disabled>&#x21A9; Undo</button>
    <button id="redo-btn" title="Redo (Ctrl+Y)" disabled>&#x21AA; Redo</button>
    <span class="separator"></span>
    <label>
      Open Image
      <input type="file" id="open-image" accept="image/*">
    </label>
    <label>
      Open TOML
      <input type="file" id="open-toml" accept=".toml">
    </label>
    <button id="save-toml">Save TOML</button>
    <button id="generate-btn" class="primary" disabled>Generate</button>
    <span class="separator"></span>
    <label class="theme-field">
      Theme
      <select id="theme-select"></select>
    </label>
    <span class="runtime-status" id="runtime-status"></span>
    <button id="about-btn" class="icon-btn" title="About PinConnect">?</button>
  </div>

  <!-- Panels -->
  <div class="panels">

    <!-- Left: connector list and TOML editor -->
    <div class="panel-editor" id="panel-editor">
      <div class="panel-tabs" role="tablist" aria-label="Board editing views">
        <button id="tab-connectors" class="panel-tab" role="tab" aria-selected="true" aria-controls="connectors-tab-panel">Connectors</button>
        <button id="tab-toml" class="panel-tab" role="tab" aria-selected="false" aria-controls="toml-tab-panel" tabindex="-1">TOML</button>
      </div>
      <div id="connectors-tab-panel" class="panel-tab-content" role="tabpanel" aria-labelledby="tab-connectors">
        <div class="connector-list-toolbar">
          <span id="connector-list-count">0 connectors</span>
          <button id="move-connector-up" class="toolbar-btn connector-move-btn" aria-label="Move selected connector up" title="Move selected connector up (Alt+↑)" disabled>↑</button>
          <button id="move-connector-down" class="toolbar-btn connector-move-btn" aria-label="Move selected connector down" title="Move selected connector down (Alt+↓)" disabled>↓</button>
          <button id="list-add-connector" class="toolbar-btn" data-draw-mode aria-pressed="false" disabled>+ Add Connector</button>
        </div>
        <p class="connector-list-hint" id="connector-list-hint">Drag to reorder · Alt+↑/↓ to move a connector</p>
        <div id="connector-list-container" class="connector-list-container"></div>
        <div id="connector-list-status" class="sr-only" role="status"></div>
      </div>
      <div id="toml-tab-panel" class="panel-tab-content" role="tabpanel" aria-labelledby="tab-toml" hidden>
        <div class="panel-editor-body" id="editor-container"></div>
      </div>
    </div>

    <div class="resizer-h" id="resizer-h"></div>

    <!-- Right panels -->
    <div class="panel-right" id="panel-right">

      <!-- Top-right: Board image -->
      <div class="panel-board" id="panel-board">
        <div class="panel-board-header">
          Board Image
          <button id="draw-mode-btn" class="toolbar-btn" data-draw-mode aria-pressed="false" disabled>+ Add Connector</button>
        </div>
        <div class="panel-board-body" id="board-body">
          <div class="board-placeholder" id="board-placeholder">
            Load a board image to get started
          </div>
        </div>
      </div>

      <div class="resizer-v" id="resizer-v"></div>

      <!-- Bottom-right: Connector editor -->
      <div class="panel-connector" id="panel-connector">
        <div class="panel-connector-header">Connector Editor</div>
        <div class="panel-connector-body" id="connector-body">
          <div class="connector-empty" id="connector-empty">
            Select a connector to edit
          </div>
        </div>
      </div>

    </div>
  </div>

</div>

<script type="module" src="js/main.js"></script>
</body>
</html>
