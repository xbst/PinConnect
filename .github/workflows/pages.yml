name: Deploy designer to GitHub Pages

# The designer is a static site that runs pinconnect in the browser under
# Pyodide, so publishing it needs no server: build the Python payload it
# fetches at startup, then upload the folder.

on:
  push:
    branches: [master]
    paths:
      - "src/pinconnect/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it; a half-published site
# is worse than a slightly stale one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build the Pyodide payload
        run: PYTHONPATH=src python -m pinconnect.payload

      - name: Stage the site
        run: |
          mkdir -p _site
          cp src/pinconnect/designer/index.html _site/
          cp src/pinconnect/designer/pinconnect.zip _site/
          cp -r src/pinconnect/designer/css _site/css
          cp -r src/pinconnect/designer/js _site/js
          echo "pinconnect.isiks.tech" > _site/CNAME

      - name: Check the payload landed
        run: |
          test -s _site/pinconnect.zip
          python - <<'PY'
          import zipfile
          names = zipfile.ZipFile("_site/pinconnect.zip").namelist()
          assert "bridge.py" in names, "payload is missing the bridge module"
          assert any(n.endswith(".toml") for n in names), "payload has no connector or theme data"
          assert "pinconnect/__init__.py" in names, "payload is missing the pinconnect package"
          stray = [n for n in names if n != "bridge.py" and not n.startswith("pinconnect/")]
          assert not stray, f"payload has entries outside pinconnect/: {stray}"
          print(f"payload ok: {len(names)} entries")
          PY

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
